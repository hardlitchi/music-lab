# ============================================================
#  楽曲工房 — ACE-Step 拡張構成 (CPU / GPU 両対応)
#
#  使用方法:
#    bash scripts/deploy-full.sh  (GPU 自動検出)
#
#  起動順:
#    1. acestep コンテナ起動 (サーバー即起動、モデルはバックグラウンドロード)
#    2. server / frontend が起動
#    3. モデルロード完了後、UI の「ACE-Step 接続済」に切り替わる
#
#  ⚠ CPU モード: 生成に数十分かかる場合があります
# ============================================================
services:
  acestep:
    build:
      context: .
      dockerfile: packages/acestep/Dockerfile
    image: music-lab-acestep
    container_name: music-lab-acestep
    ports:
      - "${ACESTEP_PORT:-8000}:8000"
    volumes:
      - audio-data:/app/outputs
      - acestep-models:/home/appuser/.cache   # .cache 全体を永続化 (huggingface / ace-step / torch)
    environment:
      PORT: "8000"
      OUTPUT_DIR: "/app/outputs"
      BF16: "${ACESTEP_BF16:-auto}"
      TORCH_COMPILE: "${ACESTEP_TORCH_COMPILE:-false}"
      CPU_OFFLOAD: "${ACESTEP_CPU_OFFLOAD:-false}"
      OVERLAPPED_DECODE: "${ACESTEP_OVERLAPPED_DECODE:-false}"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request,json,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=10); d=json.loads(r.read()); sys.exit(0 if d.get('model_loaded') else 1)"
      interval: 30s
      timeout: 15s
      retries: 40          # 最大 40 回 × 30s = 20 分待機
      start_period: 60s    # サーバー起動後 60s で healthcheck 開始
    restart: unless-stopped

  # server は acestep が「起動した」時点でスタート (モデルロード完了は待たない)
  # モデルロード中は UI の「ACE-Step 接続中」バナーで状態を表示する
  server:
    environment:
      ACESTEP_API_URL: "http://acestep:8000"
    depends_on:
      acestep:
        condition: service_started   # service_healthy ではなく service_started

volumes:
  audio-data:
    driver: local
  acestep-models:
    driver: local
