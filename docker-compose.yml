# ============================================================
#  楽曲工房 — ベース構成 (frontend + server)
#  GPU なし / ACE-Step なしで動作します
#
#  フル構成 (ACE-Step込み) は docker-compose.full.yml を参照:
#    docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#    または scripts/deploy-full.sh を使用
# ============================================================
services:
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${SERVER_PORT:-4001}}
    image: music-lab-frontend
    container_name: music-lab-frontend
    ports:
      - "${FRONTEND_PORT:-5200}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: music-lab-server
    container_name: music-lab-server
    ports:
      - "${SERVER_PORT:-4001}:8001"
    environment:
      PORT: "8001"
      NODE_ENV: "${NODE_ENV:-production}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5200}}"
      # docker-compose.full.yml で http://acestep:8000 に上書きされる
      ACESTEP_API_URL: "${ACESTEP_API_URL:-http://localhost:${ACESTEP_PORT:-8000}}"
      AUDIO_OUTPUT_DIR: "/app/outputs"
    volumes:
      - audio-data:/app/outputs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  audio-data:
    driver: local
